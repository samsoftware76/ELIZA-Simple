[pytest]
# Only tests/ is ever collected - keeps pytest from wandering into
# migrations/, one-off scripts like test_email.py at the repo root, or venv/.
testpaths = tests

# -ra: print a short summary of every non-passing test (including skips/
#      xfails) at the end, not just failures.
# --strict-markers: an unregistered @pytest.mark.foo is a hard error instead
#      of a silent no-op typo.
addopts = -ra --strict-markers
